version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: centsible-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: centsible
      POSTGRES_PASSWORD: centsible_dev_pw
      POSTGRES_DB: centsible_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centsible -d centsible_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: